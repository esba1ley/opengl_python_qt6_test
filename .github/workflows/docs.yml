# Build the Sphinx manual on every push to develop, main and the GitFlow
# feature and release branches, and publish it to GitHub Pages from main only, so the site always matches the latest release.
# The Python packages come from the same conda files as a local build;
# PlantUML, Java and Graphviz come from apt, as the README describes for
# Debian. Graphviz stays out of conda on purpose; see environment-docs.yml.
name: docs

on:
  push:
    branches: [develop, main, "ft/**", "rc/**"]
  workflow_dispatch:
    inputs:
      force-miniconda:
        description: "Skip Miniforge and use the runner's Miniconda, to test the fallback"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}
    env:
      # Pinned so the cache key below is stable; "latest" would miss it on
      # every Miniforge release.
      MINIFORGE_VERSION: 26.9.4-0
      MINIFORGE_DIR: ${{ github.workspace }}/.miniforge-installer
    steps:
      - uses: actions/checkout@v4

      - name: Install PlantUML, Java and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends plantuml graphviz

      # GitHub's release downloads time out now and then (HTTP 504), which
      # failed whole builds. Keep the installer in the Actions cache and fetch
      # it with retries only when the cache misses. The cache is saved only
      # after a complete download, so a failed one never poisons the key.
      - name: Restore the Miniforge installer
        id: miniforge-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MINIFORGE_DIR }}
          key: miniforge-${{ env.MINIFORGE_VERSION }}-Linux-x86_64

      - name: Download the Miniforge installer
        id: miniforge-download
        if: steps.miniforge-cache.outputs.cache-hit != 'true' && !inputs.force-miniconda
        continue-on-error: true
        run: |
          mkdir -p "$MINIFORGE_DIR"
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 20 \
            --output "$MINIFORGE_DIR/Miniforge3-Linux-x86_64.sh.part" \
            "https://github.com/conda-forge/miniforge/releases/download/$MINIFORGE_VERSION/Miniforge3-$MINIFORGE_VERSION-Linux-x86_64.sh"
          mv "$MINIFORGE_DIR/Miniforge3-Linux-x86_64.sh.part" \
            "$MINIFORGE_DIR/Miniforge3-Linux-x86_64.sh"

      - name: Save the Miniforge installer
        if: steps.miniforge-download.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.MINIFORGE_DIR }}
          key: miniforge-${{ env.MINIFORGE_VERSION }}-Linux-x86_64

      - name: Set up Miniforge
        if: >-
          !inputs.force-miniconda &&
          (steps.miniforge-cache.outputs.cache-hit == 'true' ||
           steps.miniforge-download.outcome == 'success')
        uses: conda-incubator/setup-miniconda@v3
        with:
          installer-url: file://${{ env.MINIFORGE_DIR }}/Miniforge3-Linux-x86_64.sh
          environment-file: environment.yml
          activate-environment: opengl_qt6_test
          channels: conda-forge
          conda-remove-defaults: "true"

      # Fallback only: the Miniconda preinstalled on GitHub's Ubuntu runners
      # needs no download. Its conda differs from Miniforge's, but every
      # package still comes from conda-forge alone.
      - name: Fall back to the runner's Miniconda
        if: >-
          inputs.force-miniconda ||
          (steps.miniforge-cache.outputs.cache-hit != 'true' &&
           steps.miniforge-download.outcome != 'success')
        run: >-
          echo "::warning title=Miniconda fallback::Miniforge
          $MINIFORGE_VERSION was not available; building with the runner's
          Miniconda instead."

      - name: Set up the runner's Miniconda
        if: >-
          inputs.force-miniconda ||
          (steps.miniforge-cache.outputs.cache-hit != 'true' &&
           steps.miniforge-download.outcome != 'success')
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: opengl_qt6_test
          channels: conda-forge
          conda-remove-defaults: "true"

      - name: Add the documentation packages
        run: conda env update -n opengl_qt6_test -f environment-docs.yml

      - name: Build the manual
        env:
          QT_QPA_PLATFORM: offscreen
        run: make -C docs html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
